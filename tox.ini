# =============================================================================
# Tox Configuration
# https://tox.wiki/en/stable/
# =============================================================================

[tox]
envlist =
    py312
    py313
    lint
    typecheck

isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
deps =
    pytest>=8.0
    pytest-cov>=4.0
    coverage[toml]>=7.0

setenv =
    PYTHONPATH = {toxinidir}/src:{toxinidir}

commands =
    pytest tst/ --cov --cov-branch {posargs}

passenv =
    HOME
    USER
    CI
    GITHUB_*

[testenv:lint]
description = Run linters (ruff)
skip_install = true
deps =
    ruff>=0.6

commands =
    ruff check src/

[testenv:typecheck]
description = Run type checker (mypy)
deps =
    mypy>=1.8

commands =
    mypy src/

[testenv:format]
description = Check code formatting
skip_install = true
deps =
    black>=24.0
    isort>=5.13

commands =
    black --check src/ tst/
    isort --check-only src/ tst/
