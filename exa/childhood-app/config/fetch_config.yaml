# Fetch Configuration
# ===================
# Edit this file to customize search settings.
# Run with: python fetch.py
# Override config with: python fetch.py --config other_config.yaml

# Search directory
output_dir: "./output"

# Search mode (enable one)
search:
  # Search by description
  query: null  # e.g., "child playing outside"

  # Search by object type
  type: null   # e.g., "person"

  # Get random result
  random: false

  # List all images
  list: false

  # Show statistics
  stats: false

# Search options
options:
  limit: 10           # Maximum results to return
  cutout: false       # Return cutout paths instead of image results
  json_output: false  # Output as JSON
