name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint (ruff/flake8 if available)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            poetry run ruff check .
          elif command -v flake8 >/dev/null 2>&1; then
            poetry run flake8 . || true
          else
            echo "No linter found (ruff/flake8). Skipping."
          fi

      - name: Type check (mypy if available)
        run: |
          if poetry run mypy --version >/dev/null 2>&1; then
            poetry run mypy src || true
          else
            echo "mypy not installed. Skipping type check."
          fi

      - name: Run tests
        run: poetry run pytest -q

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: ./.pytest_cache
