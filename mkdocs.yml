# Footer
# =============================================================================

copyright: >
  Copyright &copy; 2025 <a href="https://www.scape.agency">Scape Agency</a>. All Rights Reserved.

# hide:
#   - footer




# Customization
# =============================================================================

extra:
  generator: false
  analytics:
    provider: google
    # property: G-QC1W520T96
  social:
    - icon: fontawesome/solid/globe
      link: https://www.scape.agency
    - icon: fontawesome/brands/github
      link: https://github.com/scape-agency
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/scape-agency/
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/scape.agency/
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/scape.agency/
  # consent:
  #   title: Cookie consent
  #   description: >-
  #     We use cookies to recognize your repeated visits and preferences, as well
  #     as to measure the effectiveness of our documentation and whether users
  #     find what they"re searching for. With your consent, you"re helping us to
  #     make our documentation better.
extra_css:
  - static/css/extra.css
extra_javascript:
  - static/js/extra.js
# extra_templates:




# Extensions
# =============================================================================

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - codehilite
  - toc:
      permalink: true
  # - pymdownx.arithmatex:
  #     generic: true
  # - pymdownx.betterem:
  #     smart_enable: all
  # - pymdownx.caret
  # - pymdownx.details
  # - pymdownx.emoji:
  #     emoji_generator: !!python/name:materialx.emoji.to_svg
  #     emoji_index: !!python/name:materialx.emoji.twemoji
  # - pymdownx.highlight:
  #     anchor_linenums: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
