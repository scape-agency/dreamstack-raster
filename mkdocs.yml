# Project Information
# =============================================================================

site_name: Dreamstack Raster Documentation
site_description: Documentation for the Dreamstack Raster package
site_author: Starling
site_url: https://www.scape.agency/

docs_dir: doc


# Repository
# =============================================================================

repo_name: "GitHub"
repo_url: https://github.com/scape-agency/dreamstack-raster/
edit_uri_template: "doc/{path}"
dev_addr: 127.0.0.1:8001



# Page tree
# =============================================================================

nav:
  - Home: index.md
  - Resources: resources.md
#   - Getting Started:
#       - Installation: getting-started/installation.md
#       - Usage: getting-started/usage.md
#   - Reference:
#       - API: reference/api.md
#       - CLI: reference/cli.md


# Theme Configuration
# =============================================================================

theme:
  name: material
  custom_dir: doc/overrides
  locale: en
  language: en
  palette:
    scheme: scape
  font: false
  # font:
  #   text: "Roboto"
  #   code: "Roboto Mono"
  logo: static/image/logo.png
  favicon: static/favicon/favicon.png
  features:
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    # - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    # - header.autohide
    - toc.follow
    # - toc.integrate


# Plugins
# =============================================================================

plugins:
  - git-revision-date
  - macros
  - mermaid2
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
