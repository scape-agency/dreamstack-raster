# -*- coding: utf-8 -*-


# =============================================================================
# Project Configuration
# =============================================================================

[project]
name = "dreamstack_raster"
version = "0.0.1"
description = "Dreamstack Raster"
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Scape Agency", email = "info@scape.agency" }]
maintainers = [{ name = "Lars van Vianen", email = "lars@scape.agency" }]
keywords = ["dreamstack", "raster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]


# =============================================================================
# Project URLs
# =============================================================================

[project.urls]
homepage = "https://scape.agency/"
repository = "https://github.com/scape-agency/dreamstack-raster"
documentation = "https://github.com/scape-agency/dreamstack-raster/doc"


# =============================================================================
# Poetry
# =============================================================================

[tool.poetry]
package-mode = true
packages = [{ include = "dreamstack", from = "src" }]


# =============================================================================
# Poetry Source
# =============================================================================

[[tool.poetry.source]]
name = "github-private"
url = "https://github.com/scape-agency"
priority = "supplemental"


# =============================================================================
# Dependencies
# =============================================================================

[tool.poetry.dependencies]
dreamstack = "^0.0.1"
dreamstack-color = { git = "https://github.com/scape-agency/dreamstack-color.git", rev = "pro" }

# Core image processing
numpy = "^2.0.0"
pillow = "^11.0.0"
scikit-image = "^0.24.0"
opencv-python = "^4.10.0"
scipy = "^1.14.0"

# Color management
colour-science = "^0.4.0"

# Raw image processing
rawpy = "^0.22.0"

# PSD file support
psd-tools = "^1.10.0"

# Advanced math and signal processing
numba = "^0.60.0"

# Font/text rendering
freetype-py = "^2.5.0"

# SVG support
svgwrite = "^1.4.0"
cairosvg = "^2.7.0"

# EXIF/metadata
piexif = "^1.1.0"

# HDR/EXR support
imageio = "^2.35.0"
OpenEXR = "^3.2.0"

# ICC color profiles
Pillow-heif = "^0.18.0"

# =============================================================================
# Development Dependencies
# =============================================================================

[tool.poetry.group.dev.dependencies]
# sturnus-dev = { git = "https://github.com/starling-cloud/sturnus-dev.git", rev = "pro" }


# =============================================================================
# Documentation Dependencies
# =============================================================================

[tool.poetry.group.doc.dependencies]
# sturnus-doc = { git = "https://github.com/starling-cloud/sturnus-doc.git", rev = "pro" }


# =============================================================================
# Scripts
# =============================================================================

[tool.poetry.scripts]
main = "dreamstack_raster.__main__:main"
test = "bin.run_tests:main"


# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
