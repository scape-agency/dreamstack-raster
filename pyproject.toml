# -*- coding: utf-8 -*-


# =============================================================================
# Project Configuration
# =============================================================================

[project]
name = "dreamstack_raster"
version = "0.0.1"
description = "Dreamstack Raster"
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Scape Agency", email = "info@scape.agency" }]
maintainers = [{ name = "Lars van Vianen", email = "lars@scape.agency" }]
keywords = ["dreamstack", "raster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]


# =============================================================================
# Project URLs
# =============================================================================

[project.urls]
homepage = "https://scape.agency/"
repository = "https://github.com/scape-agency/dreamstack-raster"
documentation = "https://github.com/scape-agency/dreamstack-raster/doc"


# =============================================================================
# Poetry
# =============================================================================

[tool.poetry]
package-mode = true
packages = [{ include = "dreamstack", from = "src" }]


# =============================================================================
# Poetry Source
# =============================================================================

[[tool.poetry.source]]
name = "github-private"
url = "https://github.com/scape-agency"
priority = "supplemental"


# =============================================================================
# Dependencies
# =============================================================================

[tool.poetry.dependencies]
dreamstack = { git = "https://github.com/scape-agency/dreamstack.git", rev = "dev" }
dreamstack-color = { git = "https://github.com/scape-agency/dreamstack-color.git", rev = "dev" }

# Core image processing
numpy = "^2.0.0"
pillow = "^11.0.0"
scikit-image = "^0.26.0"
opencv-python = "^4.10.0"
scipy = "^1.14.0"

# Color management
colour-science = { version = "^0.4.0", python = ">=3.12,<3.15" }

# Raw image processing (optional - no Python 3.13 wheels yet)
rawpy = { version = "^0.26.1", optional = true, python = ">=3.12,<3.13" }

# PSD file support
psd-tools = "^1.10.0"

# Font/text rendering
freetype-py = "^2.5.0"

# SVG support
svgwrite = "^1.4.0"
cairosvg = "^2.7.0"

# EXIF/metadata
piexif = "^1.1.0"

# HDR/EXR support
imageio = "^2.35.0"
OpenEXR = "^3.4.5"

# ICC color profiles
Pillow-heif = "^0.18.0"

# ML/Object Detection
# Note: ultralytics will install torch automatically
ultralytics = "^8.3.0"

# AI Vision/Description
chimp-openai = { git = "https://github.com/blue-chimp/chimp-openai.git", rev = "pro" }
chimp-mistral = { git = "https://github.com/blue-chimp/chimp-mistral.git", rev = "pro" }

# Advanced segmentation
# Pin transformers to 4.44.x for groundingdino-py compatibility (has prebuilt wheels)
transformers = ">=4.40.0,<4.50.0"
groundingdino-py = "^0.4.0"
segment-anything = "^1.0"

[tool.poetry.extras]
raw = ["rawpy"]

# =============================================================================
# Development Dependencies
# =============================================================================

[tool.poetry.group.dev.dependencies]
# sturnus-dev = { git = "https://github.com/starling-cloud/sturnus-dev.git", rev = "pro" }


# =============================================================================
# Documentation Dependencies
# =============================================================================
ruff = "^0.15.1"

[tool.poetry.group.doc.dependencies]
# sturnus-doc = { git = "https://github.com/starling-cloud/sturnus-doc.git", rev = "pro" }


# =============================================================================
# Scripts
# =============================================================================

[tool.poetry.scripts]
main = "dreamstack_raster.__main__:main"
test = "bin.run_tests:main"


# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501", # Line too long (handled by formatter)
    "E741", # Ambiguous variable name (l for lightness is standard in color science)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Unused imports in __init__.py are re-exports


# =============================================================================
# Pyright/Pylance Configuration
# =============================================================================

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
# cv2 returns MatLike which is compatible with NDArray at runtime
reportReturnType = false
reportArgumentType = false
# Exclude non-Python config files and standard directories
exclude = [
    ".coveragerc",
    ".venv/**",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "tmp/**",
    "bup/**",
]
