[pytest]
minversion = 8.0
testpaths = tst
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# JUnit + coverage outputs into tst/
junit_family = xunit2
addopts =
    -ra
    --strict-config
    --strict-markers
    --cov=dreamstack.raster
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:tst/reports/htmlcov
    --cov-report=xml:tst/reports/coverage.xml
    --junitxml=tst/reports/junit.xml

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ml: marks tests requiring optional ML extras
    io_psd: marks tests requiring psd-tools
    io_exr: marks tests requiring OpenEXR/imageio
    io_raw: marks tests requiring rawpy
    io_heif: marks tests requiring pillow-heif
